{% macro feed_items(emails, open_email, unread_only=False, oob=False) %}
{% for item in emails %}
<button id="item-{{ item.id }}"
        class="item {{ 'vi' if item.label == 'very_important' else '' }} {{ 'on' if open_email and open_email.id == item.id else '' }} {{ 'unread' if item.unread else 'read' }}"
        data-id="{{ item.id }}"
        {% if oob %}hx-swap-oob="true"{% endif %}
        hx-post="/emails/{{ item.id }}/open"
        hx-target="#reader" hx-swap="innerHTML"
        hx-include="#filter-form, #q, #reader-open">
  <div class="t">
    <span class="sender-wrap">
      {% if item.unread %}
        <span class="udot" title="Unread"></span>
      {% endif %}
      <span class="sname">{{ item.sender_name }}</span>
    </span>
    <span class="meta-right">
      {% if item.label == 'very_important' %}
        <span class="urgent-tag">Urgent</span>
      {% endif %}
      <span class="d">{{ item.date_short }}</span>
    </span>
  </div>
  <div class="s">{{ item.subject }}</div>
  <div class="p">{{ item.snippet }}</div>
</button>
{% else %}
<div class="none">{% if unread_only %}No unread emails here.{% else %}No emails here.{% endif %}</div>
{% endfor %}
{% endmacro %}
