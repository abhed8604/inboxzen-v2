{% import "partials/macros.html" as m %}
<div class="scrim {{ 'on' if settings_open | default(false) else '' }}" id="scrim" onclick="handleScrimClick(event)">
  <div class="modal" role="dialog" aria-modal="true">
    {{ m.settings_side(active_pane | default('rules')) }}
    <div class="mmain" id="mmain">
      <button class="x" onclick="closeSettingsModal()" aria-label="Close settings" {% if autofocus_close | default(false) %}autofocus{% endif %}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>

      {% include "partials/_settings_pane_dispatch.html" %}
    </div>
  </div>
</div>
