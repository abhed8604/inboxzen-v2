<aside class="pane">
  <div class="brand">
    <div class="logo">
      <svg viewBox="32 32 448 448" width="36" height="36">
        <defs>
          <linearGradient id="sb-logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#14403f"/>
            <stop offset="1" stop-color="#081b1d"/>
          </linearGradient>
          <clipPath id="sb-logo-c">
            <rect x="120" y="166" width="272" height="192" rx="34"/>
          </clipPath>
        </defs>
        <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#sb-logo-g)"/>
        <rect x="33.5" y="33.5" width="445" height="445" rx="110.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
        <g clip-path="url(#sb-logo-c)">
          <rect x="120" y="166" width="272" height="192" fill="#2a8a83"/>
          <polygon points="120,166 120,358 256,264" fill="#35a095"/>
          <polygon points="392,166 392,358 256,264" fill="#1d6e69"/>
          <polygon points="120,358 392,358 256,264" fill="#14504d"/>
          <polygon points="120,166 392,166 256,264" fill="#86dac9"/>
        </g>
      </svg>
    </div>
    <div>
      <b>InboxZen</b>
      <span>One inbox. Zero noise.</span>
    </div>
  </div>

  <nav>
    <button class="nav {{ 'on' if current_tab in ['important', 'low_priority', 'all'] else '' }}" id="nav-inbox-btn"
            hx-get="/emails?tab=important" hx-params="not tab"
            hx-target="#swap-root" hx-include="#filter-form, #q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13h5l1.5 3h5L16 13h5"/>
        <path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/>
      </svg>
      Inbox
      <em id="sidebar-total-count">{{ counts.unread }}</em>
    </button>

    <button class="nav act" hx-post="/sync" hx-target="#swap-root" hx-include="#filter-form, #q, #reader-open, #page-state" hx-indicator="this">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 0 0-14.5-4L4 9"/>
        <path d="M4 4v5h5"/>
        <path d="M4 13a8 8 0 0 0 14.5 4L20 15"/>
        <path d="M20 20v-5h-5"/>
      </svg>
      Sync mails
    </button>

    <button class="nav act" hx-post="/rescan" hx-target="#swap-root" hx-include="#filter-form, #q, #reader-open, #page-state" hx-indicator="this">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Rescan
    </button>

    <button class="nav" hx-get="/fragments/settings?pane=rules" hx-target="#settings-root" hx-swap="innerHTML">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
        <circle cx="15" cy="7" r="2"/>
        <circle cx="9" cy="17" r="2"/>
      </svg>
      Settings
    </button>
  </nav>

  <div class="acct">
    <div class="acct-head">
      <span class="cap">Accounts</span>
    </div>
    {% import "partials/macros.html" as m %}
    {{ m.acct_list(accounts, selected_account) }}
  </div>

  <div class="foot">
    {% include "partials/engine_footer.html" %}
  </div>
</aside>
