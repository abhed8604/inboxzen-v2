<!DOCTYPE html>
<html lang="en" data-theme="{{ current_theme or 'dark' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function() {
      try {
        var match = document.cookie.match(/(^|;)\s*iz-theme=([^;]+)/);
        if (match) document.documentElement.dataset.theme = match[2];
      } catch(e) {}
    })();
  </script>
  <title>{% block title %}InboxZen — Autonomous Email Triage{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />

  <!-- Core Stylesheet (fonts are vendored under /static/fonts) -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- HTMX (vendored, keeps the app fully offline) -->
  <script src="/static/js/htmx.min.js"></script>

  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Core Application Scripts -->
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
