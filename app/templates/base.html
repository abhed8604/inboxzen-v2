<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}InboxZen — Autonomous Email Triage{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>

  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Core Application Scripts -->
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
